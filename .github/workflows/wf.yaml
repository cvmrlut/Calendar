name: Build and Deploy Calendar

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/wf.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-slim
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      TZ: Asia/Shanghai

    steps:
      - name: Prepare container
        shell: sh
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates tzdata
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v5

      - name: Get npm cache directory
        id: npm-cache
        shell: sh
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build calendar
        run: npm run build

      # 清理 dist 中的符号链接和硬链接
      # GitHub Pages Artifact 不支持 symlinks/hardlinks
      - name: Sanitize dist for Pages
        shell: sh
        run: |
          echo "Removing symlinks and hard links from dist..."
          find dist -type l -delete
          # 检查硬链接(inode 引用数 > 1)
          find dist -type f -links +1 -exec echo "Hard link found: {}" \; -delete
          echo "Sanitization complete. Remaining files:"
          find dist -type f | head -20
          du -sh dist

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist
          retention-days: 1
          if-no-files-found: error

      # 使用 upload-artifact 代替 upload-pages-artifact, 在容器内仅做普通 artifact 上传，避免 finalize 404 错误
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 在宿主机环境中下载并部署, deploy-pages 会自动处理 github-pages artifact 格式
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5